
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #174a8b;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid pink;
            margin-bottom: 15px;
        }

        .card {
            background: pink;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 500px;
        }
    </style>
</head>

<body>

    <img src="My photo.jpg"
         alt="My Profile Picture"
         class="profile-pic">

    <h1>Welcome to My Website!</h1>

    <div class="card">
        <h2>About Me</h2>
        <p>I am an SHS Grade 12 student.</p>
        <p>I am learning how to publish a website
        using GitHub Pages.</p>

        <h2>My Interests</h2>
        <p>Technology, music, and learning new skills.</p>
    </div>

    <p>Created for Empowerment Technologies.</p>

</body>
</html>
